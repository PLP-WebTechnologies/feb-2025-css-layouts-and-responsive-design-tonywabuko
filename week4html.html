<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Webpage</title>
  <style>
    /* CSS Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      line-height: 1.6;
      background: #ffffff; /* Bright white background */
      color: #333;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 1rem;
    }

    /* Header using Flexbox */
    header {
      background: #4CAF50; /* Bright green */
      color: #fff;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 1rem;
    }

    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    /* Grid Layout */
    main.grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2rem;
      margin-top: 2rem;
    }

    .content {
      background-color: #e3f2fd; /* Light blue */
      padding: 1rem;
      border-radius: 10px;
    }

    .sidebar {
      background-color: #fff9c4; /* Light yellow */
      padding: 1rem;
      border-radius: 10px;
    }

    /* Sidebar Styles */
    .sidebar h3 {
      margin-bottom: 1rem;
    }

    .sidebar p {
      margin-bottom: 1rem;
    }

    /* Sidebar Links Styling */
    .sidebar-links {
      list-style: none;
      padding: 0;
    }

    .sidebar-links li {
      margin: 0.5rem 0;
    }

    .sidebar-links a {
      color: #333;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    .sidebar-links a:hover {
      color: #4CAF50; /* Change to green on hover */
      text-decoration: underline;
    }

    /* Footer */
    footer {
      background: #4CAF50;
      color: #fff;
      text-align: center;
      padding: 1rem;
      margin-top: 2rem;
    }

    /* Responsive Media Queries */
    @media (max-width: 768px) {
      .nav {
        flex-direction: column;
        align-items: flex-start;
      }

      main.grid {
        grid-template-columns: 1fr;
      }

      .nav-links {
        flex-direction: column;
        gap: 0.5rem;
      }

      .sidebar {
        margin-top: 2rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <h1>My Website</h1>
      <nav>
        <ul class="nav-links">
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container grid">
    <section class="content">
      <h2>Welcome</h2>
      <p>This is a responsive layout using Flexbox, Grid, and Media Queries. Resize the window to see the magic!</p>
    </section>
    <aside class="sidebar">
      <h3>Sidebar</h3>
      <p>Here are some extra links:</p>
      <ul class="sidebar-links">
        <li><a href="#">Contact</a></li>
        <li><a href="#">School</a></li>
        <li><a href="#">Football</a></li>
        <li><a href="#">Coding</a></li>
      </ul>
    </aside>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2025 My Responsive Site</p>
    </div>
  </footer>
</body>
</html>
